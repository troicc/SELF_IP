<tspan x="540" dy="0.0">quiet · 插画占位，不作为成品</tspan>
</text>
<text x="76" y="1280" fill="#77716B" font-size="27" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Source Han Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Hiragino Sans GB&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif" font-weight="500" text-anchor="start">
