<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
<rect width="1080" height="1440" fill="#F8F2E8"/>
<text x="76" y="70" fill="#77716B" font-size="22" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Source Han Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Hiragino Sans GB&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif" font-weight="500" text-anchor="start"><tspan x="76" dy="0.0">坐一会儿再走</tspan></text>
<line x1="76" y1="94" x2="154" y2="94" stroke="#D56E42" stroke-width="5" stroke-linecap="round"/>
<line x1="175" y1="370" x2="905" y2="370" stroke="#D5CDC1" stroke-width="2" stroke-dasharray="8 12"/>
<text x="540" y="346" fill="#D5CDC1" font-size="22" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Source Han Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Hiragino Sans GB&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif" font-weight="400" text-anchor="middle"><tspan x="540" dy="0.0">together · 插画占位，不作为成品</tspan></text>
<text x="78" y="730" fill="#77716B" font-size="40" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Source Han Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Hiragino Sans GB&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif" font-weight="400" text-anchor="start"><tspan x="78" dy="0.0">那晚，阿迟没有删掉这个朋友。</tspan><tspan x="78" dy="54.0">也没有再把自己的感受删成‘没事’。</tspan></text>
<text x="78" y="980" fill="#1E3550" font-size="64" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Source Han Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Hiragino Sans GB&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif" font-weight="700" text-anchor="start"><tspan x="78" dy="0.0">体谅别人，</tspan><tspan x="78" dy="78.1">不必先省掉自己。</tspan></text>
<line x1="78" y1="1148" x2="265" y2="1148" stroke="#D56E42" stroke-width="7" stroke-linecap="round"/>
<text x="78" y="1260" fill="#77716B" font-size="31" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Source Han Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Hiragino Sans GB&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif" font-weight="500" text-anchor="start"><tspan x="78" dy="0.0">你最近哪句‘没事’，其实很有事？</tspan></text>
<text x="1004" y="1374" fill="#77716B" font-size="16" font-family="&#x27;Noto Sans CJK SC&#x27;,&#x27;Source Han Sans SC&#x27;,&#x27;PingFang SC&#x27;,&#x27;Hiragino Sans GB&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif" font-weight="400" text-anchor="end"><tspan x="1004" dy="0.0">原创虚构</tspan></text>
<circle cx="486" cy="1370" r="4" fill="#D5CDC1"/><circle cx="513" cy="1370" r="4" fill="#D5CDC1"/><circle cx="540" cy="1370" r="4" fill="#D5CDC1"/><circle cx="567" cy="1370" r="4" fill="#D5CDC1"/><circle cx="594" cy="1370" r="7" fill="#D56E42"/>
</svg>
