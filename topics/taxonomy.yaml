{
  "schema_version": "1.0.0",
  "relationships": {
    "family": {
      "label": "亲情",
      "allowed_subtypes": ["parent_adult_child", "siblings", "extended_family", "caregiving"],
      "watch_for": ["孝顺单一标准", "代际本质化", "用爱抵消边界"]
    },
    "romance": {
      "label": "爱情",
      "allowed_subtypes": ["dating", "cohabiting", "long_distance", "breakup_aftercare"],
      "watch_for": ["性别对立", "依恋类型伪诊断", "把猜中需求当作爱"]
    },
    "friendship": {
      "label": "友情",
      "allowed_subtypes": ["old_friends", "work_friends", "life_stage_drift", "repair"],
      "watch_for": ["把淡掉等同于背叛", "用社交频率衡量价值", "劝人断交爽文化"]
    },
    "self": {
      "label": "自我关系",
      "allowed_subtypes": ["rest", "self_request", "achievement", "solitude"],
      "watch_for": ["效率化自我照顾", "把疲惫诊断成人格", "靠口号治愈"]
    }
  },
  "scene_requirements": {
    "minimum_concrete_dimensions": 3,
    "dimensions": ["time", "place", "object", "observable_action"],
    "rule": "scene 字段必须是一句能画出来的话，不能只写‘沟通问题’或‘边界感’。"
  },
  "mentor_modes": {
    "witness_then_question": "长辈先复述看到的动作，再问一个问题，不给结论",
    "misread_then_correct": "长辈先误读，受到反驳后改口",
    "mutual_uncertainty": "三人都没有完整答案，只把问题说准一点",
    "practical_nudge_with_consent": "先征得同意，再提出十分钟内能做的小动作",
    "elder_conflict": "周叔与琴姨意见不同，阿迟不必选边",
    "silent_company": "行动与停顿承担主要陪伴，不强行解释"
  },
  "ending_types": {
    "small_action": "完成一个低风险、可撤回的小动作",
    "rephrased_request": "把控诉、猜测或暗示改写成具体请求",
    "open_unresolved": "明确承认当下无解，但指出下一次观察点",
    "boundary_without_verdict": "设一个边界，不宣布谁是坏人",
    "repair_attempt": "只发出一次修复邀请，不保证对方接受"
  },
  "source_types": {
    "original_fiction": "本故事为原创虚构，人物与情节均为创作。",
    "authorized_anonymous_adaptation": "本故事经授权匿名改编，识别性细节已作虚构化处理。"
  },
  "statuses": ["idea", "pilot_ready", "pilot_scripted", "review", "published", "retired"],
  "metrics_contract": {
    "fields": ["impressions", "read_through_rate", "saves", "shares", "comments", "specific_story_comments"],
    "note": "指标用于复盘表达与共鸣，不倒推制造冲突。"
  }
}

